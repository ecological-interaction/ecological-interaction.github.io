          - History and Theory of Ecological Information: information/EIRKB/history-and-theory.md
          - Reference Register: information/EIRKB/reference-register.md
      - Geographic Sources:
          - Resource catalogue: information/GISDS/index.md
          - Research guide: information/GISDS/research-guide.md
      - Ecological Indicators:
          - Scientific catalogue: information/EII/index.md
          - Research guide: information/EII/research-guide.md
          - Machine reference: information/EII/machine-reference.md
      - Observation Systems:
          - Scientific catalogue: information/OSDS/index.md
          - Research guide: information/OSDS/research-guide.md
          - Machine reference: information/OSDS/machine-reference.md
  - Computation: computation/index.md
  - Intelligence: intelligence/index.md
  - Infrastructure: infrastructure/index.md
  - Generation: generation/index.md
