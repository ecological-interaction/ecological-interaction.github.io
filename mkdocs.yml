site_name: Ecological Interaction
site_description: Open ecological research, computation and design
site_url: https://ecological-interaction.github.io/

repo_url: https://github.com/ecological-interaction/ecological-interaction.github.io
repo_name: ecological-interaction

theme:
  name: material
  logo: assets/branding/ecological-interaction-logo.png
  features:
    - navigation.indexes

extra:
  # Keep header and mobile-menu branding linked home without a sidebar entry.
  homepage: /

extra_css:
  - stylesheets/site.css
extra_javascript:
  - javascripts/navigation-accessibility.js

hooks:
  - scripts/eirkb_publication.py
  - scripts/information_publication.py
  - scripts/gisds_publication.py
  - scripts/eii_publication.py
  - scripts/osds_publication.py

nav:
  - Understanding: understanding/index.md
  - Information:
      - information/index.md
      - Philosophical Approaches:
          - information/EIRKB/index.md
          - Historic Arc: information/EIRKB/historic-arc.md
          - Intellectual Lineages: information/EIRKB/intellectual-lineages.md
          - Intellectual Map: information/EIRKB/intellectual-map.md
      - Geographic Sources:
          - information/GISDS/index.md
          - GISDS — Resource Catalogue: information/GISDS/resource-catalogue.md
      - Indicator Inventory:
          - information/EII/index.md
          - EII — Remote Sensing: information/EII/remote-sensing.md
          - EII — Observational Systems: information/EII/observational-systems.md
      - Observational Systems and Data Sources:
          - information/OSDS/index.md
          - Scientific Reference Register: information/OSDS/scientific-reference-register.md
  - Computation: computation/index.md
  - Intelligence: intelligence/index.md
  - Infrastructure: infrastructure/index.md
  - Generation: generation/index.md
